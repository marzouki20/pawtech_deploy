[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.intl", "composer"]

[phases.build]
cmds = [
  "cd /app && composer install --no-dev --optimize-autoloader --no-scripts"
]

[start]
cmd = "frankenphp run --config /app/Caddyfile"